[project]
name = "brainstudio"
version = "0.1.0"
description = "EEG + eye-tracking analysis and visualisation for BIDS and XDF data (MNE + PyGaze)"
readme = "README.md"
authors = [
    { name = "Paolo Burelli", email = "burelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "mne-bids>=0.20.0",
    "pandas>=3.1.1",
    "pybv>=0.8.1",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
    "python-pygaze>=0.7.6",
    "pyxdf>=1.18.0",
    "scipy>=1.18.1",
    "setuptools>=84.2.1",
]

[project.scripts]
brainstudio = "brainstudio.gui.app:main"
brainstudio-demo = "brainstudio.demo:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
