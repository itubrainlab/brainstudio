[project]
name = "brainstudio"
version = "0.1.6"
description = "EEG + eye-tracking analysis: XDF/EDF/BIDS loading, preprocessing, epoching, ERP components and band power (MNE + pymovements)"
keywords = ["eeg", "eye tracking", "erp", "xdf", "bids", "mne", "pymovements", "lsl"]
readme = "README.md"
authors = [
    { name = "Paolo Burelli", email = "burelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "autoreject>=0.5.2",
    "av>=14",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "mne-bids>=0.20.0",
    "mne-icalabel>=0.10.0",
    "onnxruntime>=1.32.0",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pybv>=0.8.1",
    "pymovements>=0.28.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
    "python-picard>=0.8.2",
    "pyxdf>=1.18.0",
    "scipy>=1.18.1",
    "setuptools>=84.2.1",
]

[project.scripts]
brainstudio = "brainstudio.gui.app:main"
brainstudio-demo = "brainstudio.demo:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "edfio>=0.4.18",
    "pyflakes>=4.1.0",
    "pytest>=9.2.0",
]
